name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # job 層級的上限也涵蓋沒有個別 timeout 的 Build step。
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - name: Build
        run: ./gradlew clean build
      - name: 非 Windows GameTest 平台契約
        timeout-minutes: 20
        run: ./gradlew runGameTest --no-daemon
      # default GameTest 失敗時仍跑 M5 GameTest，兩邊的失敗都看得到；前一步失敗時 job 已是紅燈，下方檢查 step 維持預設（略過）。
      - name: 非 Windows M5 GameTest
        if: ${{ !cancelled() }}
        timeout-minutes: 20
        run: ./gradlew runGameTestM5 --no-daemon
      - name: 確認非 Windows 跨平台案例確實執行
        shell: pwsh
        run: |
          # 非 Windows 上 `_windows` 案例一律平台略過；以下跨平台案例是 Ubuntu 唯一的真實入場／傳送覆蓋，必須存在且實際通過（不可略過或缺席）。
          [xml]$gameTests = Get-Content -Raw 'build/gametest-results.xml'
          $requiredCrossPlatform = @(
            'quantumchamber:m1_empty|m2corridorgametests.unsupported_checkpoint_platform_rejects_start_without_residue',
            'quantumchamber:m1_empty|m2corridorgametests.unmanaged_entity_command_teleport_into_superposition_stays_at_source'
          )
          foreach ($testName in $requiredCrossPlatform) {
            $identity = $testName.Split('|')
            $nodes = @($gameTests.SelectNodes("//testcase[@classname='$($identity[0])' and @name='$($identity[1])']"))
            $node = if ($nodes.Count -eq 1) { $nodes[0] } else { $null }
            if ($null -eq $node -or $null -ne $node.failure -or $null -ne $node.error -or $null -ne $node.skipped) {
              throw "必要跨平台 GameTest 未實際通過：$testName"
            }
          }
          # M5 run（runGameTestM5，M5 plan 決策 6）：batch 前綴 m5_universe 的案例只在這個 run 執行。名稱以 _windows 結尾的案例在非 Windows
          # 平台略過，不列入；其餘每一個都必須出現在 M5 XML 並實際通過。嚴格掃描（@GameTest 緊接方法宣告）與寬鬆掃描（batchId 字串）的數量
          # 不一致代表宣告格式漂移，嚴格掃描會漏要求，必須失敗。掃描前先去掉註解行（//、/*、* 開頭）。
          # 同一份判定另有兩處：Windows 檢查 step 與 scripts/verification/gates.ps1 的 Declared-GameTests，三處必須同步。
          [xml]$m5Tests = Get-Content -Raw 'build/gametest-m5-results.xml'
          # XML classname 是結構；Java class 在完整 name 前綴。清單固定來自來源，不由當次 XML 反推。
          $requiredM5Default = @(
            'quantumchamber:m1_empty|m2corridorgametests.native_frozen_movement_gets_throttled_position_corrections_windows',
            'quantumchamber:m1_empty|m4candidatedoorgametests.collapse_states_attach_without_returning_and_lookup_only_occupying_sessions',
            'quantumchamber:m1_empty|m4candidatedoorgametests.collapse_states_derive_presence_and_never_return_through_reconcile',
            'quantumchamber:m1_empty|m4candidatedoorgametests.native_collapsing_buff_lapse_returns_through_the_retained_path_windows',
            'quantumchamber:m1_empty|m4candidatedoorgametests.native_measured_checkpoint_ignores_unrelated_chunk_failure_windows',
            'quantumchamber:m1_empty|m4candidatedoorgametests.native_measured_release_waits_for_the_source_entity_storage_windows',
            'quantumchamber:m1_empty|m4candidatedoorgametests.native_quarantined_selection_converges_to_checked_returning_windows',
            'quantumchamber:m1_empty|m4candidatedoorgametests.native_start_cancel_fault_quarantines_unchecked_initial_at_once_windows',
            'quantumchamber:m1_empty|m4candidatedoorgametests.native_start_double_fault_residue_converges_and_releases_chamber_windows',
            'quantumchamber:m1_empty|m4candidatedoorgametests.native_start_readback_fault_overwrites_unacknowledged_arming_and_dedupes_warning_windows',
            'quantumchamber:m1_empty|m4candidatedoorgametests.unchecked_residue_is_quarantined_and_removed_without_pausing_recovery',
            'quantumchamber:m1_empty|m5collapsegametests.door_target_refuses_unloaded_chunks_without_forcing_them',
            'quantumchamber:m1_empty|m5collapsegametests.door_target_rollback_failure_blocks_activation_until_the_next_success',
            'quantumchamber:m1_empty|m5collapsegametests.dormant_entry_within_the_commit_backoff_is_consumed_without_a_commit',
            'quantumchamber:m1_empty|m5collapsegametests.dormant_source_receipt_resumes_only_on_a_powered_enabled_entry_edge',
            'quantumchamber:m1_empty|m5collapsegametests.every_bulkhead_state_holds_back_fluids',
            'quantumchamber:m1_empty|m5collapsegametests.harness_hook_slots_fail_fast_and_leave_no_residue',
            'quantumchamber:m1_empty|m5collapsegametests.membrane_door_states_keep_the_detector_open_and_every_close_clears_them',
            'quantumchamber:m1_empty|m5collapsegametests.native_commit_failure_falls_back_to_dormant_and_backs_off_windows',
            'quantumchamber:m1_empty|m5collapsegametests.native_offline_participant_rejoins_and_returns_while_the_collapse_holds_windows',
            'quantumchamber:m1_empty|m5collapsegametests.native_persistent_release_write_fault_waits_for_the_journal_backoff_windows',
            'quantumchamber:m1_empty|m5collapsegametests.native_return_write_fault_retries_only_the_same_write_then_settles_windows',
            'quantumchamber:m1_empty|m5collapsegametests.native_returned_participant_starts_elsewhere_and_only_the_active_session_returns_him_windows',
            'quantumchamber:m1_empty|m5collapsegametests.native_source_selection_collapses_returns_the_cohort_and_opens_the_door_windows',
            'quantumchamber:m1_empty|m5collapsegametests.nether_and_end_universe_receipts_are_cancelled_once_dormant',
            'quantumchamber:m1_empty|m5collapsegametests.nether_live_new_selection_recovers_to_dormant_then_cancels_windows',
            'quantumchamber:m1_empty|m5collapsegametests.nether_side_doors_are_refused_and_an_m4_source_receipt_still_completes_windows',
            'quantumchamber:m1_empty|m5collapsegametests.permanently_sealed_sessions_at_startup_remind_the_admin_once',
            'quantumchamber:m1_empty|m5collapsegametests.sealed_retry_at_startup_leaves_a_door_without_a_membrane_unwritten',
            'quantumchamber:m1_empty|m5collapsegametests.sealed_retry_at_startup_opens_a_membrane_door_and_keeps_it_open_while_waiting',
            'quantumchamber:m1_empty|m5collapsegametests.settled_collapse_roll_forward_into_sealed_is_retried_by_recovery_with_backoff',
            'quantumchamber:m1_empty|m5collapsegametests.source_fast_path_terminal_write_fault_backs_off_and_keeps_the_door',
            'quantumchamber:m1_empty|m5collapsegametests.startup_passage_ready_ends_and_normalizes_the_door_next_tick'
          )
          $requiredM5Run = @(
            'quantumchamber:m1_empty|m5universedoorgametests.ownerless_membrane_is_normalized_on_the_next_tick_unless_a_collapse_session_owns_the_door',
            'quantumchamber:m1_empty|m5universedoorgametests.prepare_door_use_failures_refuse_and_warn_once_per_cause_until_recovery_writes_are_safe',
            'quantumchamber:m1_empty|m5universedoorgametests.prepare_participant_closing_by_the_controller_with_an_entity_in_the_doorway_leaves_it_open',
            'quantumchamber:m1_empty|m5universedoorgametests.prepare_participant_closing_the_door_ends_the_collapse_before_the_preload_with_the_universe_kept',
            'quantumchamber:m1_empty|m5universedoorgametests.prepare_rejected_seal_write_hands_the_door_back_open_until_the_retry_seals_it',
            'quantumchamber:m1_empty|m5universedoorgametests.prepare_seals_the_membrane_only_with_a_clear_doorway_and_no_non_participant_inside',
            'quantumchamber:m1_empty|m5universedoorgametests.quarantined_prepare_hands_the_origin_door_back_open_and_reseals_it_after_converging',
            'quantumchamber:m1_empty|m5universedoorgametests.rejected_seal_write_is_retried_on_the_per_session_backoff_without_rerunning_resolve',
            'quantumchamber:m1_empty|m5universedoorgametests.sealed_door_closes_once_after_its_chunk_reloads_and_stays_open_once_a_player_opens_it',
            'quantumchamber:m1_empty|m5universedoorgametests.sealed_door_with_a_membrane_keeps_its_pending_close_when_a_player_uses_it',
            'quantumchamber:m1_empty|m5universedoorgametests.startup_reapplies_a_stale_membrane_in_waiting_once_on_the_next_tick',
            'quantumchamber:m1_empty|m5universegametests.allocation_write_fault_seals_then_retries_after_the_backoff_with_one_universe',
            'quantumchamber:m1_empty|m5universegametests.disabled_record_of_the_session_is_reenabled_after_an_allocation_io_retry',
            'quantumchamber:m1_empty|m5universegametests.discovery_read_fault_seals_unreadable_until_a_restart',
            'quantumchamber:m1_empty|m5universegametests.dormant_new_receipt_resolves_without_power_then_waits_for_an_entry_edge',
            'quantumchamber:m1_empty|m5universegametests.existing_receipt_revalidates_the_same_universe_without_writing',
            'quantumchamber:m1_empty|m5universegametests.existing_receipt_without_a_discovered_universe_seals_permanently',
            'quantumchamber:m1_empty|m5universegametests.existing_resolve_waits_for_an_unconfirmed_discovery_without_sealing_and_warns_once',
            'quantumchamber:m1_empty|m5universegametests.harness_await_converges_an_unflushed_catalog_change',
            'quantumchamber:m1_empty|m5universegametests.harness_await_inside_a_scheduled_callback_keeps_other_scheduled_checks',
            'quantumchamber:m1_empty|m5universegametests.harness_complete_retries_without_losing_the_baseline',
            'quantumchamber:m1_empty|m5universegametests.materialize_failure_disables_the_record_and_seals_until_a_restart',
            'quantumchamber:m1_empty|m5universegametests.sanity_allocates_one_disabled_record_without_materializing',
            'quantumchamber:m1_empty|m5universegametests.sealed_entry_with_an_unconfirmed_write_still_closes_the_door_and_releases_the_ticket',
            'quantumchamber:m1_empty|m5universepassagegametests.crossed_write_failure_pauses_the_passage_until_it_converges_then_expires',
            'quantumchamber:m1_empty|m5universepassagegametests.crossed_write_rejected_still_shows_the_arrival_title_and_the_closed_message_at_the_expiry',
            'quantumchamber:m1_empty|m5universepassagegametests.dormant_passage_reaches_comparator_fifteen_and_survives_refreshes_after_a_waiting_power_cut',
            'quantumchamber:m1_empty|m5universepassagegametests.existing_passage_brings_a_second_chamber_to_the_same_universe',
            'quantumchamber:m1_empty|m5universepassagegametests.existing_ready_revalidation_seals_when_the_universe_became_ineligible',
            'quantumchamber:m1_empty|m5universepassagegametests.passage_closed_by_the_one_who_stayed_skips_the_one_who_crossed',
            'quantumchamber:m1_empty|m5universepassagegametests.passage_crossing_needs_the_previous_tick_observation_after_skipped_ticks',
            'quantumchamber:m1_empty|m5universepassagegametests.passage_crossings_arrive_in_stone_water_lava_and_mid_jump',
            'quantumchamber:m1_empty|m5universepassagegametests.passage_ends_with_a_plain_open_door_when_the_source_loses_power',
            'quantumchamber:m1_empty|m5universepassagegametests.passage_expires_after_one_of_two_crossed_and_the_chamber_opens_a_new_session_windows',
            'quantumchamber:m1_empty|m5universepassagegametests.passage_participant_closing_the_door_ends_it_and_non_participants_are_refused',
            'quantumchamber:m1_empty|m5universepassagegametests.passage_participant_crosses_to_the_same_pose_while_non_participants_and_riders_stay',
            'quantumchamber:m1_empty|m5universepassagegametests.passage_power_loss_skips_the_one_who_crossed',
            'quantumchamber:m1_empty|m5universepassagegametests.passage_recovery_seal_write_failure_closes_the_passage_until_another_flush',
            'quantumchamber:m1_empty|m5universepassagegametests.passage_transfer_recovery_required_seals_and_keeps_the_crossed_receipt',
            'quantumchamber:m1_empty|m5universepassagegametests.passage_transfer_rolled_back_keeps_the_passage_open_and_warns_once',
            'quantumchamber:m1_empty|m5universepassagegametests.ready_write_failure_keeps_the_door_plain_when_the_prepare_reenters_within_the_backoff',
            'quantumchamber:m1_empty|m5universepassagegametests.ready_write_failure_restores_backs_off_and_opens_the_door_plainly',
            'quantumchamber:m1_empty|m5universeprojectiongametests.checkpoint_failure_seals_before_the_projection_is_complete',
            'quantumchamber:m1_empty|m5universeprojectiongametests.checkpoint_waits_for_a_clean_recheck_while_the_invariant_cells_keep_changing',
            'quantumchamber:m1_empty|m5universeprojectiongametests.deleting_the_projection_ledger_after_complete_degrades_and_seals_without_rewriting_the_interior',
            'quantumchamber:m1_empty|m5universeprojectiongametests.existing_revisit_checkpoints_a_repair_interrupted_before_its_checkpoint',
            'quantumchamber:m1_empty|m5universeprojectiongametests.existing_revisit_repairs_only_the_invariant_cells_and_keeps_the_interior',
            'quantumchamber:m1_empty|m5universeprojectiongametests.pending_write_failure_seals_without_writing_any_block',
            'quantumchamber:m1_empty|m5universeprojectiongametests.prepare_new_runs_the_destination_side_then_opens_the_passage',
            'quantumchamber:m1_empty|m5universeprojectiongametests.prepare_power_loss_releases_the_destination_ticket_and_an_entry_edge_resumes_it',
            'quantumchamber:m1_empty|m5universeprojectiongametests.prepare_seals_a_conflict_when_another_chamber_completed_an_overlapping_projection',
            'quantumchamber:m1_empty|m5universeprojectiongametests.prepare_seals_a_conflict_when_the_destination_already_has_a_controller_without_a_ledger_entry',
            'quantumchamber:m1_empty|m5universeprojectiongametests.prepare_validates_the_site_of_an_existing_complete_entry_before_repairing',
            'quantumchamber:m1_empty|m5universeprojectiongametests.prepare_waits_for_a_player_in_the_destination_volume_and_warns_once_after_six_hundred_ticks',
            'quantumchamber:m1_empty|m5universeprojectiongametests.prepare_waits_while_another_projection_write_is_unconfirmed',
            'quantumchamber:m1_empty|m5universeprojectiongametests.projection_controllers_are_recognized_by_the_index_on_load_sync_and_block_added',
            'quantumchamber:m1_empty|m5universeprojectiongametests.projection_first_write_overwrites_the_volume_without_drops_or_neighbor_updates',
            'quantumchamber:m1_empty|m5universeprojectiongametests.projection_invariant_cells_resist_breaking_placing_explosions_pistons_and_fluids',
            'quantumchamber:m1_empty|m5universeprojectiongametests.projection_write_failure_seals_then_retries_after_the_backoff_over_its_own_pending',
            'quantumchamber:m1_empty|m5universeprojectiongametests.projection_writer_waits_for_players_and_repairs_only_the_invariant_cells'
          )
          if ($requiredM5Default.Count -ne 33 -or $requiredM5Run.Count -ne 60) { throw 'M5 明列清單數量必須為 default 新增 33 與 M5 run 60' }
          foreach ($required in @(
            @{ xml=$gameTests; identities=$requiredM5Default; run='default 新增' },
            @{ xml=$m5Tests; identities=$requiredM5Run; run='M5' }
          )) {
            foreach ($testIdentity in $required.identities) {
              $identity = $testIdentity.Split('|')
              if ($identity[1].EndsWith('_windows', [StringComparison]::Ordinal)) { continue }
              $nodes = @($required.xml.SelectNodes("//testcase[@classname='$($identity[0])' and @name='$($identity[1])']"))
              $node = if ($nodes.Count -eq 1) { $nodes[0] } else { $null }
              if ($null -eq $node -or $null -ne $node.failure -or $null -ne $node.error -or $null -ne $node.skipped) {
                throw "M5 明列 $($required.run) GameTest 未實際通過或身分不符：$testIdentity"
              }
            }
          }
          $m5Declared = @()
          foreach ($file in Get-ChildItem -Path 'src/testmod/java' -Recurse -Filter '*.java') {
            $source = (@((Get-Content -Raw -LiteralPath $file.FullName) -split '\r?\n') | Where-Object { $_ -notmatch '^\s*(//|/\*|\*)' }) -join "`n"
            $strictM5 = @([regex]::Matches($source, '(?s)@GameTest\((?<annotation>[^)]*)\)\s*public void (?<name>\w+)\(TestContext') | Where-Object { $_.Groups['annotation'].Value -match 'batchId\s*=\s*"m5_universe' })
            $looseM5 = [regex]::Matches($source, 'batchId\s*=\s*"m5_universe').Count
            if ($strictM5.Count -ne $looseM5) {
              throw "M5 GameTest 宣告掃描不一致（$($file.Name)）：嚴格掃描 $($strictM5.Count) 個，寬鬆掃描 $looseM5 個"
            }
            foreach ($match in $strictM5) {
              $m5Declared += $file.BaseName.ToLowerInvariant() + '.' + $match.Groups['name'].Value
            }
          }
          if ($m5Declared.Count -eq 0) { throw '找不到任何 M5 GameTest 宣告，守門規則失效' }
          foreach ($testName in @($m5Declared | Where-Object { $_ -notlike '*_windows' })) {
            $node = $m5Tests.SelectSingleNode("//testcase[@name='$testName']")
            if ($null -eq $node -or $null -ne $node.failure -or $null -ne $node.error -or $null -ne $node.skipped) {
              throw "必要 M5 GameTest 未實際通過：$testName"
            }
          }
      - name: Upload mod JAR
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quantumchamber-jars
          path: build/libs/*.jar
          if-no-files-found: error
      - name: 上傳 Ubuntu 測試證據
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quantumchamber-tests-ubuntu
          path: |
            build/test-results/test/*.xml
            build/gametest-results.xml
            build/gametest-m5-results.xml
            run/gametest/logs/latest.log
            run/gametest-m5/logs/latest.log
          if-no-files-found: error

  windows-native:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      # 這一步含 clean build 與全部 JUnit（2026-10-01 run 36804549120 約 9 分鐘），上限比純 GameTest 的 step 寬。
      - name: Windows 原生建置與 GameTest
        timeout-minutes: 30
        run: ./gradlew.bat clean build runGameTest --rerun-tasks --no-daemon
      # default GameTest 失敗時仍跑 M5 GameTest，兩邊的失敗都看得到；前一步失敗時 job 已是紅燈，下方檢查 step 維持預設（略過）。
      - name: Windows 原生 M5 GameTest
        if: ${{ !cancelled() }}
        timeout-minutes: 20
        run: ./gradlew.bat runGameTestM5 --no-daemon
      - name: 確認 Windows 原生案例確實執行
        shell: pwsh
        run: |
          # 各項檢查先彙整，最後一次列出全部缺席／失敗名稱；任一項不符即 throw（維持失敗即紅）。
          $problems = [System.Collections.Generic.List[string]]::new()
          $suites = @('PlayerCheckpointStoreTest', 'WindowsPlayerCheckpointVerifierTest')
          foreach ($suite in $suites) {
            [xml]$result = Get-Content -Raw "build/test-results/test/TEST-dev.quantumchamber.persistence.$suite.xml"
            $row = $result.testsuite
            if ([int]$row.tests -le 0 -or [int]$row.failures -ne 0 -or [int]$row.errors -ne 0 -or [int]$row.skipped -ne 0) {
              $problems.Add("必要 Windows 原生 suite 未全數實際通過：$suite")
            }
          }
          # 非 Windows 專屬拒絕案例在 Windows 合法略過，不套用全 XML 零 skipped。
          [xml]$gameTests = Get-Content -Raw 'build/gametest-results.xml'
          # M5 run（runGameTestM5，M5 plan 決策 6）的 XML：batch 前綴 m5_universe 的案例只在這個 run 執行。
          [xml]$m5Tests = Get-Content -Raw 'build/gametest-m5-results.xml'
          # XML classname 是結構；Java class 在完整 name 前綴。清單固定來自來源，不由當次 XML 反推。
          $requiredM5Default = @(
            'quantumchamber:m1_empty|m2corridorgametests.native_frozen_movement_gets_throttled_position_corrections_windows',
            'quantumchamber:m1_empty|m4candidatedoorgametests.collapse_states_attach_without_returning_and_lookup_only_occupying_sessions',
            'quantumchamber:m1_empty|m4candidatedoorgametests.collapse_states_derive_presence_and_never_return_through_reconcile',
            'quantumchamber:m1_empty|m4candidatedoorgametests.native_collapsing_buff_lapse_returns_through_the_retained_path_windows',
            'quantumchamber:m1_empty|m4candidatedoorgametests.native_measured_checkpoint_ignores_unrelated_chunk_failure_windows',
            'quantumchamber:m1_empty|m4candidatedoorgametests.native_measured_release_waits_for_the_source_entity_storage_windows',
            'quantumchamber:m1_empty|m4candidatedoorgametests.native_quarantined_selection_converges_to_checked_returning_windows',
            'quantumchamber:m1_empty|m4candidatedoorgametests.native_start_cancel_fault_quarantines_unchecked_initial_at_once_windows',
