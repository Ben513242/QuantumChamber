name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - name: Build
        run: ./gradlew clean build
      - name: 非 Windows GameTest 平台契約
        run: ./gradlew runGameTest --no-daemon
      - name: 確認非 Windows 跨平台案例確實執行
        shell: pwsh
        run: |
          # 非 Windows 上 `_windows` 案例一律平台略過；以下跨平台案例是 Ubuntu 唯一的真實入場／傳送覆蓋，必須存在且實際通過（不可略過或缺席）。
          [xml]$gameTests = Get-Content -Raw 'build/gametest-results.xml'
          $requiredCrossPlatform = @(
            'unsupported_checkpoint_platform_rejects_start_without_residue',
            'unmanaged_entity_command_teleport_into_superposition_stays_at_source'
          )
          foreach ($testName in $requiredCrossPlatform) {
            $node = $gameTests.SelectSingleNode("//testcase[@name='m2corridorgametests.$testName']")
            if ($null -eq $node -or $null -ne $node.failure -or $null -ne $node.error -or $null -ne $node.skipped) {
              throw "必要跨平台 GameTest 未實際通過：$testName"
            }
          }
      - name: Upload mod JAR
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quantumchamber-jars
          path: build/libs/*.jar
          if-no-files-found: error
      - name: 上傳 Ubuntu 測試證據
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quantumchamber-tests-ubuntu
          path: |
            build/test-results/test/*.xml
            build/gametest-results.xml
            run/gametest/logs/latest.log
          if-no-files-found: error

  windows-native:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - name: Windows 原生建置與 GameTest
        run: ./gradlew.bat clean build runGameTest --rerun-tasks --no-daemon
      - name: 確認 Windows 原生案例確實執行
        shell: pwsh
        run: |
          $suites = @('PlayerCheckpointStoreTest', 'WindowsPlayerCheckpointVerifierTest')
          foreach ($suite in $suites) {
            [xml]$result = Get-Content -Raw "build/test-results/test/TEST-dev.quantumchamber.persistence.$suite.xml"
            $row = $result.testsuite
            if ([int]$row.tests -le 0 -or [int]$row.failures -ne 0 -or [int]$row.errors -ne 0 -or [int]$row.skipped -ne 0) {
              throw "必要 Windows 原生 suite 未全數實際通過：$suite"
            }
          }
          # 非 Windows 專屬拒絕案例在 Windows 合法略過，不套用全 XML 零 skipped。
          [xml]$gameTests = Get-Content -Raw 'build/gametest-results.xml'
          $requiredGameTests = @(
            'trusted_offline_cohort_cannot_be_dropped_before_release_windows',
            'trusted_return_source_snapshot_changes_are_rejected_windows',
            'trusted_entrance_alias_edge_preserves_open_intent_windows',
            'trusted_native_initial_and_whole_cohort_remap_windows',
            'trusted_publish_checkpoint_failure_preserves_false_windows',
            'trusted_incomplete_cohort_after_false_never_publishes_windows',
            'trusted_retirement_preserves_live_valuable_item_windows',
            'trusted_last_lease_requires_checked_remove_windows',
            'trusted_pin_cap_includes_players_and_items_windows',
            'trusted_far_components_retain_unaffected_instance_windows',
            'trusted_geometry_requires_durable_reservation_and_stays_unpublished',
            'trusted_returning_before_geometry_never_builds',
            'trusted_retirement_retries_failed_cell_before_release',
            'trusted_returning_before_prepare_retires_durable_reservation',
            'native_lever_closed_buffed_cohort_enters_fixed_world_windows',
            'native_missing_one_buff_rejects_whole_cohort',
            'native_zero_people_never_starts_session',
            'native_only_spectator_never_starts_or_consumes',
            'native_twenty_six_people_rejected_before_reservation',
            'native_second_move_failure_rolls_back_hidden_nbt_whole_cohort_windows',
            'native_after_false_publish_failure_keeps_current_hidden_effect_windows',
            'native_buff_expiry_during_geometry_keeps_precommit_returning_windows',
            'native_shared_entry_preserves_frozen_relative_pose_north_windows',
            'native_shared_entry_preserves_frozen_relative_pose_east_windows',
            'native_shared_entry_preserves_frozen_relative_pose_south_windows',
            'native_shared_entry_preserves_frozen_relative_pose_west_windows',
            'native_staging_disconnect_keeps_frozen_offline_participant_windows',
            'native_staging_extra_occupant_rejects_without_shortening_journal_windows',
            'native_staging_low_keeps_current_effect_and_source_protection_windows',
            'native_projection_identified_before_budget_split_publish_windows',
            'native_projection_identified_before_budget_split_cancel_windows',
            'native_replaced_source_controller_never_rolls_to_snapshot_windows',
            'native_changed_source_uuid_never_rolls_to_snapshot_windows',
            'native_partial_move_invalid_source_keeps_actual_world_pose_windows',
            'native_returned_participant_moves_while_offline_member_pending_windows',
            'unsupported_checkpoint_platform_rejects_start_without_residue',
            'native_superposition_rejects_entity_placement_without_consuming_items_windows',
            'native_experience_orb_crosses_seam_and_returns_before_cleanup_windows',
            'native_return_move_exception_logs_cause_once_then_recovers_windows',
            'native_buff_loss_return_logs_info_without_stack_windows',
            'native_arming_abort_leaves_unentered_members_in_place_windows',
            'native_moving_player_return_logs_no_pending_move_warning_windows',
            'unmanaged_entity_command_teleport_into_superposition_stays_at_source'
          )
          foreach ($testName in $requiredGameTests) {
            $node = $gameTests.SelectSingleNode("//testcase[@name='m2corridorgametests.$testName']")
            if ($null -eq $node -or $null -ne $node.failure -or $null -ne $node.skipped) {
              throw "必要 Windows 原生 GameTest 未實際通過：$testName"
            }
          }
          # M4 候選門真入場需要原生 checkpoint；非 Windows 以 `_windows` 平台略過，Windows 必須實際通過。
          # legacy 專用 batch 只在 runGameTestLegacy 執行，不在此清單。
          $requiredM4GameTests = @(
            'native_selection_all_25_cells_first_wins_and_measured_freeze_windows',
            'native_selection_rejects_identity_bbox_cohort_source_and_incomplete_windows',
            'native_selection_flush_failure_never_sends_success_windows',
            'native_selection_readback_failure_never_sends_success_windows',
            'native_selection_fault_never_admitted_by_other_session_flush_or_native_save_windows',
            'native_candidate_batch_fault_converges_to_checked_returning_windows',
            'native_start_initial_flush_fault_rejects_without_residue_windows',
            'dormant_receipt_blocks_only_its_chamber_and_participant_enters_other_chamber_windows',
            'busy_participant_start_rejected_before_any_reservation_windows',
            'native_selection_cannot_use_candidate_before_checked_batch_readback_windows',
            'native_selection_rejects_pending_batch_retired_and_unready_mapping_windows',
            'north_complete_doors_recycle_split_merge_and_seam_windows',
            'east_complete_doors_require_checked_ledger_windows',
            'south_complete_doors_require_checked_ledger_windows',
            'west_complete_doors_require_checked_ledger_windows',
            'unhealthy_authorities_reject_before_reservation_windows',
            'native_start_freezes_candidate_context_before_geometry_windows',
            'native_measured_checkpoint_failure_backs_off_then_reaches_dormant_windows'
          )
          foreach ($testName in $requiredM4GameTests) {
            $node = $gameTests.SelectSingleNode("//testcase[@name='m4candidatedoorgametests.$testName']")
            if ($null -eq $node -or $null -ne $node.failure -or $null -ne $node.skipped) {
              throw "必要 Windows 原生 M4 GameTest 未實際通過：$testName"
            }
          }
          # 通則（補強上方清單，不取代）：名稱以 _windows 結尾的案例在非 Windows 平台略過，在 Windows 必須全部實際通過。
          # 1) XML 內每個 _windows 案例都不得有 failure／error／skipped。
          $windowsCases = @($gameTests.SelectNodes('//testcase') | Where-Object { $_.name -like '*_windows' })
          foreach ($case in $windowsCases) {
            if ($null -ne $case.failure -or $null -ne $case.error -or $null -ne $case.skipped) {
              throw "Windows 原生 _windows GameTest 未實際通過：$($case.name)"
            }
          }
          # 2) testmod 原始碼宣告的每個 _windows 案例都必須出現在 XML（不可缺席）；legacy 專用 batch 只在 runGameTestLegacy 執行，不在此列。
          $declared = @()
          foreach ($file in Get-ChildItem -Path 'src/testmod/java' -Recurse -Filter '*GameTests.java') {
            $source = Get-Content -Raw -LiteralPath $file.FullName
            foreach ($match in [regex]::Matches($source, '(?s)@GameTest\((?<annotation>[^)]*)\)\s*public void (?<name>\w+_windows)\(TestContext')) {
              if ($match.Groups['annotation'].Value -notmatch 'batchId\s*=\s*"m4_legacy_runtime"') {
                $declared += $file.BaseName.ToLowerInvariant() + '.' + $match.Groups['name'].Value
              }
            }
          }
          if ($declared.Count -eq 0) { throw '找不到任何 _windows GameTest 宣告，守門規則失效' }
          $present = @($windowsCases | ForEach-Object { $_.name })
          foreach ($testName in $declared) {
            if ($testName -notin $present) { throw "Windows 原生 _windows GameTest 缺席：$testName" }
          }
          Write-Output "Windows 原生 _windows GameTest：宣告 $($declared.Count) 個，XML $($windowsCases.Count) 個，全部實際通過"
      - name: 上傳 Windows 原生測試證據
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quantumchamber-native-windows
          path: |
            build/libs/*.jar
            build/test-results/test/*.xml
            build/gametest-results.xml
            run/gametest/logs/latest.log
          if-no-files-found: error
