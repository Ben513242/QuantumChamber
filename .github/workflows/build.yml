name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - name: Build
        run: ./gradlew clean build
      - name: 非 Windows GameTest 平台契約
        run: ./gradlew runGameTest --no-daemon
      - name: Upload mod JAR
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quantumchamber-jars
          path: build/libs/*.jar
          if-no-files-found: error
      - name: 上傳 Ubuntu 測試證據
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quantumchamber-tests-ubuntu
          path: |
            build/test-results/test/*.xml
            build/gametest-results.xml
            run/gametest/logs/latest.log
          if-no-files-found: error

  windows-native:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - name: Windows 原生建置與 GameTest
        run: ./gradlew.bat clean build runGameTest --rerun-tasks --no-daemon
      - name: 確認 Windows 原生案例確實執行
        shell: pwsh
        run: |
          $suites = @('PlayerCheckpointStoreTest', 'WindowsPlayerCheckpointVerifierTest')
          foreach ($suite in $suites) {
            [xml]$result = Get-Content -Raw "build/test-results/test/TEST-dev.quantumchamber.persistence.$suite.xml"
            $row = $result.testsuite
            if ([int]$row.tests -le 0 -or [int]$row.failures -ne 0 -or [int]$row.errors -ne 0 -or [int]$row.skipped -ne 0) {
              throw "必要 Windows 原生 suite 未全數實際通過：$suite"
            }
          }
          # 非 Windows 專屬拒絕案例在 Windows 合法略過，不套用全 XML 零 skipped。
          [xml]$gameTests = Get-Content -Raw 'build/gametest-results.xml'
          $requiredGameTests = @(
            'trusted_offline_cohort_cannot_be_dropped_before_release_windows',
            'trusted_return_source_snapshot_changes_are_rejected_windows',
            'trusted_entrance_alias_edge_preserves_open_intent_windows',
            'trusted_native_initial_and_whole_cohort_remap_windows',
            'trusted_publish_checkpoint_failure_preserves_false_windows',
            'trusted_incomplete_cohort_after_false_never_publishes_windows',
            'trusted_retirement_preserves_live_valuable_item_windows',
            'trusted_last_lease_requires_checked_remove_windows',
            'trusted_pin_cap_includes_players_and_items_windows',
            'trusted_far_components_retain_unaffected_instance_windows',
            'trusted_geometry_requires_durable_reservation_and_stays_unpublished',
            'trusted_returning_before_geometry_never_builds',
            'trusted_retirement_retries_failed_cell_before_release',
            'trusted_returning_before_prepare_retires_durable_reservation',
            'native_lever_closed_buffed_cohort_enters_fixed_world_windows',
            'native_missing_one_buff_rejects_whole_cohort',
            'native_zero_people_never_starts_session',
            'native_only_spectator_never_starts_or_consumes',
            'native_twenty_six_people_rejected_before_reservation',
            'native_second_move_failure_rolls_back_hidden_nbt_whole_cohort_windows',
            'native_after_false_publish_failure_keeps_current_hidden_effect_windows',
            'native_buff_expiry_during_geometry_keeps_precommit_returning',
            'native_shared_entry_preserves_frozen_relative_pose_north_windows',
            'native_shared_entry_preserves_frozen_relative_pose_east_windows',
            'native_shared_entry_preserves_frozen_relative_pose_south_windows',
            'native_shared_entry_preserves_frozen_relative_pose_west_windows',
            'native_staging_disconnect_keeps_frozen_offline_participant',
            'native_staging_extra_occupant_rejects_without_shortening_journal',
            'native_staging_low_keeps_true_pending_and_source_protection',
            'native_projection_identified_before_budget_split_publish_windows',
            'native_projection_identified_before_budget_split_cancel_windows',
            'native_replaced_source_controller_never_rolls_to_snapshot_windows',
            'native_changed_source_uuid_never_rolls_to_snapshot_windows',
            'native_partial_move_invalid_source_keeps_actual_world_pose_windows'
          )
          foreach ($testName in $requiredGameTests) {
            $node = $gameTests.SelectSingleNode("//testcase[@name='m2corridorgametests.$testName']")
            if ($null -eq $node -or $null -ne $node.failure -or $null -ne $node.skipped) {
              throw "必要 Windows 原生 GameTest 未實際通過：$testName"
            }
          }
      - name: 上傳 Windows 原生測試證據
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quantumchamber-native-windows
          path: |
            build/libs/*.jar
            build/test-results/test/*.xml
            build/gametest-results.xml
            run/gametest/logs/latest.log
          if-no-files-found: error
