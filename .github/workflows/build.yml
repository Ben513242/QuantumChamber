          #    嚴格掃描取得 annotation 以區分 batch；另以寬鬆掃描（任何 void <name>_windows( 宣告）交叉核對同一檔的名稱集合，
          #    不一致代表宣告格式漂移（例如 @GameTest 與方法間多了 annotation），嚴格掃描會漏要求，必須失敗。
          #    規則 3 的 M5 宣告在同一個迴圈掃描。掃描前先去掉註解行（//、/*、* 開頭，含 Javadoc 內的 {@code @GameTest}）。
          #    「哪些 test 屬於 M5 run」另有兩處：Ubuntu 檢查 step 與 scripts/verification/gates.ps1 的 Declared-GameTests，三處必須同步。
          $declared = @()
          $declaredM5 = @()
          $m5Declared = @()
          foreach ($file in Get-ChildItem -Path 'src/testmod/java' -Recurse -Filter '*.java') {
            $source = (@((Get-Content -Raw -LiteralPath $file.FullName) -split '\r?\n') | Where-Object { $_ -notmatch '^\s*(//|/\*|\*)' }) -join "`n"
            $strict = @([regex]::Matches($source, '(?s)@GameTest\((?<annotation>[^)]*)\)\s*public void (?<name>\w+_windows)\(TestContext'))
            $strictNames = @($strict | ForEach-Object { $_.Groups['name'].Value } | Sort-Object -Unique)
            $looseNames = @([regex]::Matches($source, 'void\s+(?<name>\w+_windows)\s*\(') | ForEach-Object { $_.Groups['name'].Value } | Sort-Object -Unique)
            $onlyLoose = @($looseNames | Where-Object { $_ -notin $strictNames })
            $onlyStrict = @($strictNames | Where-Object { $_ -notin $looseNames })
            if ($onlyLoose.Count -gt 0 -or $onlyStrict.Count -gt 0) {
              $problems.Add("_windows 宣告掃描不一致（$($file.Name)）：僅寬鬆掃描 [$($onlyLoose -join ', ')]；僅嚴格掃描 [$($onlyStrict -join ', ')]")
            }
            foreach ($match in $strict) {
              $annotation = $match.Groups['annotation'].Value
              $caseName = $file.BaseName.ToLowerInvariant() + '.' + $match.Groups['name'].Value
              if ($annotation -match 'batchId\s*=\s*"m5_universe') {
                $declaredM5 += $caseName
              } elseif ($annotation -notmatch 'batchId\s*=\s*"m4_legacy_runtime"') {
                $declared += $caseName
              }
            }
            # 規則 3 的宣告：batch 前綴 m5_universe 的全部案例（不論名稱），嚴格與寬鬆（batchId 字串）掃描數量必須一致。
            $strictM5 = @([regex]::Matches($source, '(?s)@GameTest\((?<annotation>[^)]*)\)\s*public void (?<name>\w+)\(TestContext') | Where-Object { $_.Groups['annotation'].Value -match 'batchId\s*=\s*"m5_universe' })
            $looseM5 = [regex]::Matches($source, 'batchId\s*=\s*"m5_universe').Count
            if ($strictM5.Count -ne $looseM5) {
              $problems.Add("M5 GameTest 宣告掃描不一致（$($file.Name)）：嚴格掃描 $($strictM5.Count) 個，寬鬆掃描 $looseM5 個")
            }
            foreach ($match in $strictM5) {
              $m5Declared += $file.BaseName.ToLowerInvariant() + '.' + $match.Groups['name'].Value
            }
          }
          if ($declared.Count -eq 0) { $problems.Add('找不到任何 _windows GameTest 宣告，守門規則失效') }
          $present = @($windowsCases | ForEach-Object { $_.name })
          foreach ($testName in $declared) {
            if ($testName -notin $present) { $problems.Add("Windows 原生 _windows GameTest 缺席：$testName") }
          }
          $m5Present = @($m5WindowsCases | ForEach-Object { $_.name })
          foreach ($testName in $declaredM5) {
            if ($testName -notin $m5Present) { $problems.Add("Windows 原生 M5 _windows GameTest 缺席：$testName") }
          }
          # 3) M5 run：每個宣告在 batch 前綴 m5_universe 的案例（不論名稱）都必須出現在 M5 XML，而且沒有 failure／error／skipped。
          if ($m5Declared.Count -eq 0) { $problems.Add('找不到任何 M5 GameTest 宣告，守門規則失效') }
          foreach ($testName in $m5Declared) {
            $node = $m5Tests.SelectSingleNode("//testcase[@name='$testName']")
            if ($null -eq $node -or $null -ne $node.failure -or $null -ne $node.error -or $null -ne $node.skipped) {
              $problems.Add("必要 M5 GameTest 未實際通過：$testName")
            }
          }
          if ($problems.Count -gt 0) {
            throw ("Windows 原生守門未通過（$($problems.Count) 項）：`n" + ($problems -join "`n"))
          }
          Write-Output "Windows 原生 _windows GameTest：default 宣告 $($declared.Count) 個、M5 宣告 $($declaredM5.Count) 個（嚴格與寬鬆掃描一致），都出現在所屬 XML；default XML $($windowsCases.Count) 個、M5 XML $($m5WindowsCases.Count) 個 _windows 案例，都沒有 failure／error／skipped"
          Write-Output "M5 GameTest：宣告 $($m5Declared.Count) 個（嚴格與寬鬆掃描一致），都出現在 M5 XML 且沒有 failure／error／skipped（M5 XML 共 $($m5Tests.SelectNodes('//testcase').Count) 個）"
      - name: 上傳 Windows 原生測試證據
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quantumchamber-native-windows
          path: |
            build/libs/*.jar
            build/test-results/test/*.xml
            build/gametest-results.xml
            build/gametest-m5-results.xml
            run/gametest/logs/latest.log
            run/gametest-m5/logs/latest.log
          if-no-files-found: error
