plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven {
        url 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
}

// 選用照明只解析供獨立客戶端複製的官方 JAR，不進入任何編譯或執行 classpath。
configurations {
    lightingMods {
        canBeResolved = true
        canBeConsumed = false
        transitive = false
    }
}

sourceSets {
    test {
        compileClasspath += main.compileClasspath
        runtimeClasspath += main.runtimeClasspath
    }

    testmod {
        compileClasspath += main.compileClasspath
        runtimeClasspath += main.runtimeClasspath
    }
}

loom {
    splitEnvironmentSourceSets()

    mods {
        quantumchamber {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }

    runs {
        client {
            client()
            runDir 'run/client-base'
        }
        clientRender {
            client()
            name 'Minecraft Client - Render Compatibility'
            runDir 'run/client-render'
        }
        clientLight {
            client()
            name 'Minecraft Client - Optional Handheld Lighting'
            runDir 'run/client-light'
        }
        server {
            server()
            runDir 'run/server'
        }
        m3Universe {
            server()
            name 'M3 Universe Native Readback'
            source sourceSets.testmod
            def nonce = providers.gradleProperty('m3UniverseNonce').getOrElse('disabled')
            if (!(nonce ==~ /[a-z0-9]+(?:-[a-z0-9]+)*/)) {
                throw new GradleException('M3 nonce 只能包含小寫英數與連字號')
            }
            // Loom runDir 只接受本專案相對路徑；探針仍須另外通過四個啟動參數檢查。
            runDir "run/m3-universe-${nonce}"
        }
        m3Transfer {
            server()
            name 'M3 Server Transfer Readiness'
            source sourceSets.testmod
            def nonce = providers.gradleProperty('m3TransferNonce').getOrElse('disabled')
            if (!(nonce ==~ /[a-z0-9]+(?:-[a-z0-9]+)*/)) {
                throw new GradleException('M3 transfer nonce 只能包含小寫英數與連字號')
            }
            // 預設關閉；探針另外驗四個啟動參數、exact cwd 與本 plan 的 evidence owner。
            runDir "run/m3-transfer-${nonce}"
        }
        m4Recovery {
            server()
            name 'M4 Retained Recovery Probe'
            source sourceSets.testmod
            def nonce = providers.gradleProperty('m4RecoveryNonce').getOrElse('disabled')
            if (!(nonce ==~ /[a-z0-9]+(?:-[a-z0-9]+)*/)) throw new GradleException('M4 nonce 只能包含小寫英數與連字號')
            runDir "run/m4-recovery-${nonce}"
            // M5 plan 決策 7：M4 retained recovery 的 24 個 phase 假設 MEASURED 會一直等待；testmod 的 collapse-suspended hook 暫停全部 session。
            vmArg '-Dquantumchamber.test.collapseSuspended=all'
            ['phase', 'nonce', 'startupNonce', 'root'].each { key ->
                def property = 'm4Recovery' + key.capitalize()
                if (providers.gradleProperty(property).isPresent()) vmArg "-Dquantumchamber.m4recovery.${key}=${providers.gradleProperty(property).get()}"
            }
        }
        // M5 F6-1：跨 JVM 的塌縮 crash／restart probe（M5CollapseRecoveryProbe，spec §12 的 crash 窗口）。每個 phase 一個 JVM，root 由
        // scripts/verification/m5-collapse-probe.ps1 建立。刻意不帶 -Dquantumchamber.test.collapseSuspended=all：這個 probe 要讓塌縮流程真的推進到
        // crash 窗口、重啟之後再推進到 PASSAGE_READY 與終局；probe 也會斷言 JVM 參數裡沒有它。
        m5Collapse {
            server()
            name 'M5 Collapse Recovery Probe'
            source sourceSets.testmod
            def nonce = providers.gradleProperty('m5CollapseNonce').getOrElse('disabled')
            if (!(nonce ==~ /[a-z0-9]+(?:-[a-z0-9]+)*/)) throw new GradleException('M5 collapse nonce 只能包含小寫英數與連字號')
            runDir "run/m5-collapse-${nonce}"
            ['phase', 'nonce', 'startupNonce', 'root'].each { key ->
                def property = 'm5Collapse' + key.capitalize()
                if (providers.gradleProperty(property).isPresent()) vmArg "-Dquantumchamber.m5collapse.${key}=${providers.gradleProperty(property).get()}"
            }
        }
        gameTest {
            server()
            name 'M1 Game Test'
            source sourceSets.testmod
            runDir 'run/gametest'
            vmArg '-Dfabric-api.gametest'
            vmArg "-Dfabric-api.gametest.report-file=${project.layout.buildDirectory.file('gametest-results.xml').get().asFile}"
        }
        gameTestLegacy {
            server()
            name 'Isolated Legacy Schema 2 Game Test'
            source sourceSets.testmod
            runDir 'run/gametest-legacy'
            vmArg '-Dfabric-api.gametest'
            vmArg '-Dquantumchamber.gametest.legacyOnly=true'
            vmArg "-Dfabric-api.gametest.report-file=${project.layout.buildDirectory.file('gametest-legacy-results.xml').get().asFile}"
        }
        // M5 plan 決策 6：會配置或物化 Universe、或會留下 M5 record 的 GameTest（batch id 前綴 m5_universe）在獨立的 fresh 世界執行，
        // 不放在共用的 default run（它的 M4 boundary oracle 要求整個 suite 前後的 catalog 與 world keys 不變）。
        gameTestM5 {
            server()
            name 'M5 Universe Game Test'
            source sourceSets.testmod
            runDir 'run/gametest-m5'
            vmArg '-Dfabric-api.gametest'
            vmArg '-Dquantumchamber.gametest.m5Only=true'
            vmArg '-Dquantumchamber.gametest.minTickMillis=10' // F6-3b：每個 tick 至少 10 ms（≤100 t/s），見 testmod 的 TestServerTickPaceMixin
            vmArg "-Dfabric-api.gametest.report-file=${project.layout.buildDirectory.file('gametest-m5-results.xml').get().asFile}"
        }
    }
}

// F1a 真 client probe（M5 spec §14）：src/testmod 之下的獨立 source set，只給開發 run 與 JUnit 使用，不進 jar／sourcesJar。
// 需要 splitEnvironmentSourceSets() 建立的 client source set，所以放在 loom 區塊之後。
sourceSets {
    clientProbe {
        java.srcDirs = ['src/testmod/clientprobe/java']
        resources.srcDirs = ['src/testmod/clientprobe/resources']
        // 只對 main 的 compile classpath（不含 clientOnly Minecraft jar）編譯，保證 dedicated server 也能載入。
        compileClasspath += main.compileClasspath + main.output + testmod.output
        // client run 只帶 testmod 的 class，不帶它的 fabric.mod.json 與 mixin 設定，mod list 不會出現 quantumchamber-testmod。
        runtimeClasspath += client.runtimeClasspath + testmod.output.classesDirs
    }
    // 空的 source set，只當 serverProbe run 的 classpath 載體；不用 clientProbe 的 runtimeClasspath，避免 clientOnly jar 上 server classpath。
    // testmod.runtimeClasspath 已含 testmod 自己的輸出。
    serverProbe {
        java.srcDirs = []
        resources.srcDirs = []
        runtimeClasspath = testmod.runtimeClasspath + clientProbe.output
    }
    // JUnit 只帶 clientProbe 的 class（不帶它的 fabric.mod.json），只測 /qcprobe 的註冊條件與純判斷。
    // test 不得呼叫 Probe 的指令路徑：那會載入 testmod 的 UniverseTransferTestAccess，需要時要另加 testmod 的 classesDirs。
    test {
        compileClasspath += clientProbe.output.classesDirs
        runtimeClasspath += clientProbe.output.classesDirs
    }
}

// 兩個 probe run 都必須以 -Pm5ProbeNonce 指定 runDir：每一次新的驗收用新的 nonce（新的 runDir），
// 同一次驗收中重啟同一個世界時沿用同一個 nonce。格式檢查與 m4Recovery 相同。
def m5ProbeNonce = providers.gradleProperty('m5ProbeNonce')
def m5ProbeRunNonce = m5ProbeNonce.getOrElse('disabled')
if (!(m5ProbeRunNonce ==~ /[a-z0-9]+(?:-[a-z0-9]+)*/)) throw new GradleException('M5 probe nonce 只能包含小寫英數與連字號')

loom {
    runs {
        clientProbe {
            client()
            name 'M5 Real Client Probe'
            source sourceSets.clientProbe
            ideConfigGenerated false
            vmArg '-Dquantumchamber.clientProbe=true'
            runDir "run/client-probe-${m5ProbeRunNonce}"
        }
        serverProbe {
            server()
            name 'M5 Real Client Probe Server'
            source sourceSets.serverProbe
            ideConfigGenerated false
            vmArg '-Dquantumchamber.clientProbe=true'
            runDir "run/server-probe-${m5ProbeRunNonce}"
        }
    }
}

['runClientProbe', 'runServerProbe'].each { probeRun ->
    tasks.named(probeRun) {
        doFirst {
            if (!m5ProbeNonce.isPresent() || m5ProbeNonce.get() == 'disabled') {
                throw new GradleException("${probeRun} 必須以 -Pm5ProbeNonce=<nonce> 指定 runDir")
            }
        }
    }
}

// clientProbeClasses 涵蓋 compile 與 processResources；Full gate 的 build 因此會建出 clientProbe。
tasks.named('check') {
    dependsOn tasks.named('clientProbeClasses')
}

dependencies {
    lightingMods "maven.modrinth:lambdynamiclights:${project.lighting_mod_version}"
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.layered {
        mappings("net.fabricmc:yarn:${project.yarn_mappings}:v2") { containsUnpick() }
        mappings file('mappings/quantumchamber-codec-identity.tiny')
    }
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    testImplementation platform('org.junit:junit-bom:5.10.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation "net.fabricmc:fabric-loader-junit:${project.loader_version}"
    testmodImplementation sourceSets.main.output
}

// Loom 1.7.4 會以 layered mappings 的合成座標尋找 :constants；精確接回原 Yarn 常數包。
afterEvaluate {
    def constants = configurations.getByName('mappingsConstants')
    def synthetic = constants.dependencies.findAll { it.group == 'loom' && it.name == 'mappings' }
    if (synthetic.size() != 1) throw new GradleException("預期一筆合成 mappingsConstants，實得 ${synthetic.size()}")
    if (!constants.dependencies.remove(synthetic[0])) throw new GradleException('合成 mappingsConstants 移除失敗')
    dependencies.add('mappingsConstants', "net.fabricmc:yarn:${project.yarn_mappings}:constants")
}

tasks.register('prepareClientLighting') {
    inputs.files(configurations.lightingMods)
    inputs.property('sha512', project.lighting_mod_sha512)
    outputs.file(layout.projectDirectory.file("run/client-light/mods/lambdynamiclights-${project.lighting_mod_version}.jar"))
    // 每次啟動都核對來源；快取遺失或被修改時不得使用舊複本降級啟動。
    outputs.upToDateWhen { false }
    doLast {
        File artifact = configurations.lightingMods.singleFile
        def digest = java.security.MessageDigest.getInstance('SHA-512')
        artifact.withInputStream { stream ->
            byte[] buffer = new byte[8192]
            int count
            while ((count = stream.read(buffer)) != -1) {
                digest.update(buffer, 0, count)
            }
        }
        String actualHash = digest.digest().encodeHex().toString()
        if (actualHash != project.lighting_mod_sha512) {
            throw new GradleException('選用照明 JAR 的 SHA512 不符，停止啟動；未複製任何模組。')
        }
        copy {
            from artifact
            into layout.projectDirectory.dir('run/client-light/mods')
            rename { "lambdynamiclights-${project.lighting_mod_version}.jar" }
        }
    }
}

tasks.named('runClientLight') {
    dependsOn tasks.named('prepareClientLighting')
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': inputs.properties.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

def sourceOracleClasses = layout.buildDirectory.dir('source-remap-oracle/classes')
tasks.register('compileSourceRemapOracle', JavaCompile) {
    source = files('scripts/verification/SourceRemapOracle.java')
    classpath = configurations.compileClasspath
    destinationDirectory = sourceOracleClasses
    options.release = 21
    options.compilerArgs.add('-proc:none')
}

tasks.register('verifySourceRemap', JavaExec) {
    dependsOn tasks.named('compileSourceRemapOracle'), tasks.named('remapJar'), tasks.named('remapSourcesJar')
    classpath = files(sourceOracleClasses) + configurations.compileClasspath
    mainClass = 'SourceRemapOracle'
    doFirst {
        setArgs([
            providers.gradleProperty('sourceOracleSources').getOrElse(tasks.named('remapSourcesJar').get().archiveFile.get().asFile.absolutePath),
            providers.gradleProperty('sourceOracleRelease').getOrElse(tasks.named('remapJar').get().archiveFile.get().asFile.absolutePath)
        ])
    }
}

tasks.named('check') {
    dependsOn tasks.named('verifySourceRemap')
}

test {
    useJUnitPlatform()
    systemProperty 'fabric.side', 'server'
    workingDir file('run/testworlds')
    doFirst {
        workingDir.mkdirs()
    }
}
