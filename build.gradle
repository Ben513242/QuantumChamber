plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven {
        url 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
}

// 選用照明只解析供獨立客戶端複製的官方 JAR，不進入任何編譯或執行 classpath。
configurations {
    lightingMods {
        canBeResolved = true
        canBeConsumed = false
        transitive = false
    }
}

sourceSets {
    test {
        compileClasspath += main.compileClasspath
        runtimeClasspath += main.runtimeClasspath
    }

    testmod {
        compileClasspath += main.compileClasspath
        runtimeClasspath += main.runtimeClasspath
    }
}

loom {
    splitEnvironmentSourceSets()

    mods {
        quantumchamber {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }

    runs {
        client {
            client()
            runDir 'run/client-base'
        }
        clientRender {
            client()
            name 'Minecraft Client - Render Compatibility'
            runDir 'run/client-render'
        }
        clientLight {
            client()
            name 'Minecraft Client - Optional Handheld Lighting'
            runDir 'run/client-light'
        }
        server {
            server()
            runDir 'run/server'
        }
        m3Universe {
            server()
            name 'M3 Universe Native Readback'
            source sourceSets.testmod
            def nonce = providers.gradleProperty('m3UniverseNonce').getOrElse('disabled')
            if (!(nonce ==~ /[a-z0-9]+(?:-[a-z0-9]+)*/)) {
                throw new GradleException('M3 nonce 只能包含小寫英數與連字號')
            }
            // Loom runDir 只接受本專案相對路徑；探針仍須另外通過四個啟動參數檢查。
            runDir "run/m3-universe-${nonce}"
        }
        m3Transfer {
            server()
            name 'M3 Server Transfer Readiness'
            source sourceSets.testmod
            def nonce = providers.gradleProperty('m3TransferNonce').getOrElse('disabled')
            if (!(nonce ==~ /[a-z0-9]+(?:-[a-z0-9]+)*/)) {
                throw new GradleException('M3 transfer nonce 只能包含小寫英數與連字號')
            }
            // 預設關閉；探針另外驗四個啟動參數、exact cwd 與本 plan 的 evidence owner。
            runDir "run/m3-transfer-${nonce}"
        }
        gameTest {
            server()
            name 'M1 Game Test'
            source sourceSets.testmod
            runDir 'run/gametest'
            vmArg '-Dfabric-api.gametest'
            vmArg "-Dfabric-api.gametest.report-file=${project.layout.buildDirectory.file('gametest-results.xml').get().asFile}"
        }
        gameTestLegacy {
            server()
            name 'Isolated Legacy Schema 2 Game Test'
            source sourceSets.testmod
            runDir 'run/gametest-legacy'
            vmArg '-Dfabric-api.gametest'
            vmArg '-Dquantumchamber.gametest.legacyOnly=true'
            vmArg "-Dfabric-api.gametest.report-file=${project.layout.buildDirectory.file('gametest-legacy-results.xml').get().asFile}"
        }
    }
}

dependencies {
    lightingMods "maven.modrinth:lambdynamiclights:${project.lighting_mod_version}"
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    testImplementation platform('org.junit:junit-bom:5.10.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation "net.fabricmc:fabric-loader-junit:${project.loader_version}"
    testmodImplementation sourceSets.main.output
}

tasks.register('prepareClientLighting') {
    inputs.files(configurations.lightingMods)
    inputs.property('sha512', project.lighting_mod_sha512)
    outputs.file(layout.projectDirectory.file("run/client-light/mods/lambdynamiclights-${project.lighting_mod_version}.jar"))
    // 每次啟動都核對來源；快取遺失或被修改時不得使用舊複本降級啟動。
    outputs.upToDateWhen { false }
    doLast {
        File artifact = configurations.lightingMods.singleFile
        def digest = java.security.MessageDigest.getInstance('SHA-512')
        artifact.withInputStream { stream ->
            byte[] buffer = new byte[8192]
            int count
            while ((count = stream.read(buffer)) != -1) {
                digest.update(buffer, 0, count)
            }
        }
        String actualHash = digest.digest().encodeHex().toString()
        if (actualHash != project.lighting_mod_sha512) {
            throw new GradleException('選用照明 JAR 的 SHA512 不符，停止啟動；未複製任何模組。')
        }
        copy {
            from artifact
            into layout.projectDirectory.dir('run/client-light/mods')
            rename { "lambdynamiclights-${project.lighting_mod_version}.jar" }
        }
    }
}

tasks.named('runClientLight') {
    dependsOn tasks.named('prepareClientLighting')
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': inputs.properties.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

test {
    useJUnitPlatform()
    systemProperty 'fabric.side', 'server'
    workingDir file('run/testworlds')
    doFirst {
        workingDir.mkdirs()
    }
}
